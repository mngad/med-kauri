[package]
name = "med"
version = "0.1.0"
description = "A Markdown editor"
authors = ["med"]
edition = "2021"

[lib]
name = "med_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
